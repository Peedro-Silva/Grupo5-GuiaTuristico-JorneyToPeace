<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="./estilizacoes/style-contato.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="./imagens/JourneyToPeace-logo.png" alt="logo-JourneyToPeace" width="100px">
            </div>
            <a href="./sobre-malta.html">Sobre</a>
            <a href="./pontosTuristicos.html">Pontos Tursticos</a>
            <a href="./gastronomia.html">Gastronomia</a>
            <a href="./pacotes.html">Pacotes</a>
            <a href="./contato.html">Contato</a>

            <div class="home">
                <a href="DesbravandoMalta.html"><img src="./imagens/ícone-de-casa.png" alt="ícone de uma casa"
                        width="50px"></a>
            </div>
        </nav>
    </header>

    <main>
        <h2>Deseja receber essas recomendações por E-mail?</h2>
        <br>
        <form action="">
            <h2>Suas Informações</h2>
            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome">
            <br>
            <label for="email">E-mail: </label>
            <input type="email" name="email" id="email">
            <br>
            <label for="telefone">Telefone: </label>
            <input type="tel" name="telefone" id="telefone">
            <br>
            <label for="dataNasc">Data de Nascimento: </label>
            <input type="date" name="dataNasc" id="dataNasc">
            <br>
            <button type="submit">Enviar</button>
        </form>

        <div class="redeSocial">
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><img
                    src="./imagens/instagram-logo.png" alt="Logo do instagram" width="50px" target="_blank"
                    rel="noopener noreferrer"></a>

            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><img
                    src="./imagens/logo-facebook.png" alt="Logo do instagram" width="50px" target="_blank"
                    rel="noopener noreferrer"></a>

            <a href="https://www.whatsapp.com/" target="_blank" rel="noopener noreferrer"><img
                    src="./imagens/logo-whatsapp.png" alt="Logo do instagram" width="50px" target="_blank"
                    rel="noopener noreferrer"></a>
        </div>
    </main>

    <footer>
        <p>© 2026 Todos os direitos reservados a JourneyToPeace</p>
    </footer>
</body>

</html>
